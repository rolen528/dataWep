<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Example</title>
</head>
<body>
    <h1>타임리프 익히기</h1>
    <!-- LocalDate를 yyyy-MM-dd 포맷으로 변경 -->
    <p th:text="${#temporals.format(today, 'yyyy-MM-dd')}"></p>
    <div th:object="${person}"> <!--person을 선택한 객체로 지정 / 해당 객체의 값으로 아래 진행 -->
        <p th:text="|이름 : *{name}|"></p>
        <p th:text="|나이 : *{age}|"></p>
        <p>취미</p>
        <ul th:each="hobby : *{hobbies}">   <!-- foreach 문 -->
            <li th:text="${hobby}"></li>
            <!-- 반복 대상이 '축구'라면 '대표 취미' 표시 추가 -->
            <span th:if="${hobby == '축구'}">(대표 취미)</span>
        </ul>

    </div>
    <!-- 1번 블로그 글을 보러 이동 -->
    <a th:href="@{/api/articles/{id}(id=${person.id})}">글 보기</a>
</body>
</html>
